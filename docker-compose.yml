version: "3.8"

name: smartcity

services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    networks:
      - smartcity-net
    ports:
      - "443:443"
      - "9091:9091"
      - "18083:18083"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app1
      - app2
      - authelia

  app1:
    build: ./app
    networks:
      - smartcity-net
    expose:
      - "5000"

  app2:
    build: ./app
    networks:
      - smartcity-net
    expose:
      - "5000"

  authelia:
    image: authelia/authelia:latest
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml
      - ./authelia/users_database.yml:/config/users_database.yml
    networks:
      - smartcity-net
    expose:
      - "9091"

  worker:
    build: ./worker
    networks:
      - smartcity-net
    depends_on:
      - emqx

  emqx:
    image: emqx/emqx:latest
    networks:
      - smartcity-net
    expose:
      - "18083"
      - "1883"

volumes:
  caddy_data:
  caddy_config:

networks:
  smartcity-net:
    driver: bridge